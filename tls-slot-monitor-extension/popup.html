<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TLS Slot Monitor</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>TLS Slot Monitor</h1>
        <label class="switch">
          <input id="enabled" type="checkbox">
          <span>On</span>
        </label>
      </header>

      <label>
        Cutoff date
        <input id="cutoffDate" type="date" min="2026-05-28" value="2026-06-20">
      </label>

      <label>
        Refresh interval
        <select id="refreshSeconds">
          <option value="180">3 minutes</option>
          <option value="300" selected>5 minutes</option>
          <option value="600">10 minutes</option>
          <option value="900">15 minutes</option>
          <option value="1800">30 minutes</option>
        </select>
      </label>

      <label class="inline">
        <input id="sound" type="checkbox" checked>
        Sound alert
      </label>

      <button id="scanNow" type="button">Scan now</button>

      <section id="status" aria-live="polite"></section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
