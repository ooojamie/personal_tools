<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TLS Slot Monitor</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Local monitor</p>
          <h1>TLS Slot Monitor</h1>
        </div>
        <label class="switch">
          <input id="enabled" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
          <span id="enabledLabel">Off</span>
        </label>
      </header>

      <section class="countdown" aria-live="polite">
        <div id="countdownValue">--:--</div>
        <div id="countdownLabel">Next refresh</div>
      </section>

      <section class="controls">
        <label>
          Cutoff date
          <input id="cutoffDate" type="date" min="2026-05-28" value="2026-06-20">
        </label>

        <label>
          Interval
          <select id="refreshSeconds">
            <option value="180">3 min</option>
            <option value="300" selected>5 min</option>
            <option value="600">10 min</option>
            <option value="900">15 min</option>
            <option value="1800">30 min</option>
          </select>
        </label>
      </section>

      <section class="filter-card">
        <div class="filter-label">Weekdays</div>
        <div class="weekday-grid" aria-label="Weekday filters">
          <button class="weekday-chip" type="button" data-day="1">Mon</button>
          <button class="weekday-chip" type="button" data-day="2">Tue</button>
          <button class="weekday-chip" type="button" data-day="3">Wed</button>
          <button class="weekday-chip" type="button" data-day="4">Thu</button>
          <button class="weekday-chip" type="button" data-day="5">Fri</button>
          <button class="weekday-chip" type="button" data-day="6">Sat</button>
          <button class="weekday-chip" type="button" data-day="0">Sun</button>
        </div>
        <div class="time-grid">
          <label>
            From
            <select id="startTime"></select>
          </label>
          <label>
            To
            <select id="endTime"></select>
          </label>
        </div>
      </section>

      <label class="sound-row">
        <input id="sound" type="checkbox" checked>
        Sound alert
      </label>

      <button id="scanNow" type="button">Scan now</button>

      <section class="status-card" aria-live="polite">
        <div class="status-row">
          <span>Last refresh</span>
          <strong id="lastRefresh">not yet</strong>
        </div>
        <div class="status-row">
          <span>No-slot text</span>
          <strong id="noSlots">unknown</strong>
        </div>
        <div class="status-row">
          <span>Seen dates</span>
          <strong id="seenDates">none</strong>
        </div>
        <div class="status-row hit-row">
          <span>Last hit</span>
          <strong id="lastHit">none</strong>
        </div>
        <div id="status" class="status-message"></div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
